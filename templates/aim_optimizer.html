<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aim Optimizer - Darts Optimizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Aim Optimizer</h1>
    <p>Find the optimal spot to aim for maximizing your one-dart score based on your throwing distribution.</p>

    <div>
        <form action="{{ url_for('aim_optimizer') }}" method="post">
            <label for="distribution">Upload your throwing distribution data:</label>
            <input type="file" id="distribution" name="distribution">
            <button type="submit">Calculate Optimal Aim</button>
        </form>
    </div>

    <div id="aim-results">
        <!-- Placeholder for results of the optimal aim calculation -->
        <h2>Your Optimal Aim Points</h2>
        <p>After uploading data, you’ll see recommendations on where to aim for best scores.</p>
    </div>

    <p><a href="{{ url_for('home') }}">Back to Home</a></p>
</body>
</html>
