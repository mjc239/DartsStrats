<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check-Out Strategy - Darts Optimizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Check-Out Strategy</h1>
    <p>Enter your current score to get the best aim points for checking out in as few darts as possible.</p>

    <div>
        <form action="{{ url_for('check_out') }}" method="post">
            <label for="current_score">Current Score:</label>
            <input type="number" id="current_score" name="current_score">
            <button type="submit">Get Check-Out Recommendations</button>
        </form>
    </div>

    <div id="check-out-results">
        <!-- Placeholder for check-out strategy results -->
        <h2>Your Optimal Check-Out Strategy</h2>
        <p>Recommended aim points will be displayed here after entering your current score.</p>
    </div>

    <p><a href="{{ url_for('home') }}">Back to Home</a></p>
</body>
</html>
